# Clean files (no breaking usages expected) and near-misses that look similar to a breaking
# usage but are not (replacement APIs, user-defined lookalikes, safe argument forms).
# Execution decides the labels; a "negative" that produces a Django warning gets labeled.

- name: clean_timezone_now
  kind: clean
  code: |
    from django.utils import timezone

    NOW = timezone.now()
    TODAY = timezone.localdate()

- name: clean_model_fields
  kind: clean
  code: |
    from django.db import models


    class Book(models.Model):
        title = models.CharField(max_length=200)
        published = models.DateField(null=True)

        class Meta:
            app_label = "sessions"
            ordering = ["title"]
            indexes = [models.Index(fields=["title", "published"])]

- name: clean_forms
  kind: clean
  code: |
    from django import forms


    class SignupForm(forms.Form):
        email = forms.EmailField()
        age = forms.IntegerField(min_value=0)


    FORM = SignupForm(data={"email": "a@example.com", "age": 3})
    OK = FORM.is_valid()

- name: clean_q_f_expressions
  kind: clean
  code: |
    from django.db.models import Count, F, Q, Value

    FILTER = Q(active=True) | Q(staff=True)
    ORDER = F("created").desc(nulls_last=True)
    ANNOTATION = Count("id")
    LABEL = Value("x")

- name: clean_html_utils
  kind: clean
  code: |
    from django.utils.html import escape, format_html, strip_tags

    SAFE = format_html("<b>{}</b>", "<script>")
    TEXT = strip_tags("<p>hi</p>")
    ESC = escape("<a>")

- name: clean_text_utils
  kind: clean
  code: |
    from django.utils.text import capfirst, slugify, Truncator

    SLUG = slugify("Hello World")
    CAP = capfirst("django")
    SHORT = Truncator("long text here").chars(5)

- name: clean_encoding
  kind: clean
  code: |
    from django.utils.encoding import force_bytes, force_str, smart_str

    A = force_str(b"abc")
    B = force_bytes("abc")
    C = smart_str(1)

- name: clean_translation
  kind: clean
  code: |
    from django.utils.translation import gettext, gettext_lazy as _, ngettext

    TITLE = _("Title")
    HELLO = gettext("Hello")
    ITEMS = ngettext("item", "items", 2)

- name: clean_signing_keywords
  kind: near_miss
  code: |
    from django.core.signing import Signer, TimestampSigner

    signer = Signer(key="secret-key-1", sep=":")
    stamp = TimestampSigner(key="secret-key-2")
    TOKEN = signer.sign("hello")


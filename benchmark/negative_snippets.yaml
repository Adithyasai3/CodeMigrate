  code: |
    import datetime

    from django.utils import timezone

    naive = datetime.datetime(2022, 3, 27, 2, 30)
    aware = timezone.make_aware(naive, datetime.timezone.utc)

- name: clean_trunc_no_is_dst
  kind: near_miss
  code: |
    from django.db.models import DateTimeField
    from django.db.models.functions import Trunc, TruncDay

    by_day = Trunc("created", "day", output_field=DateTimeField())
    by_day2 = TruncDay("created")

